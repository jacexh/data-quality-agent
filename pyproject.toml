[project]
name = "data-quality-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.0",
    "mcap>=1.1",
    "mcap-ros2-support>=0.5",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
    "anthropic>=0.40",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    "setuptools<74",       # required by webrtcvad shim (pkg_resources); >=74 removed top-level pkg_resources
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
