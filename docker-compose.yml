services:
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_WEBHOOK_ENABLE_agent: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_agent: "http://agent:8000/notify"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
      agent:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing myminio/robot-uploads &&
        mc event add myminio/robot-uploads arn:minio:sqs::agent:webhook --event s3:ObjectCreated:* &&
        echo 'MinIO setup complete'
      "

  agent:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: robot-uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
